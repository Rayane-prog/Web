<style>
    .stretch-button{
        background-color: green;
        color : white;
        border : none;
        font-size: 18px;
        padding : 7px 15px;
        cursor : pointer;   
        transition : padding 0.2s; 
    }
    .stretch-button:hover{
        padding : 21px 45px;
    }


    .shadow-button{
        background-color: green;
        color: white;
        border : none;
        font-size: 18px;
        padding : 7px 15px;
        box-shadow : 5px 5px 4px rgba(0,0,0,0.6)
    }
    .shadow-button:active{
        box-shadow: none;
        margin-left: 5px;
        margin-top : 5px;
    }
    
</style>

<button class="stretch-button">
    Stretch
</button>
<br><br><br>
<button class="shadow-button">
    Shadow
</button>
