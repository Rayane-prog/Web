<style>
    .subscribe-button{
        background-color: rgb(196, 9, 9);
        color : white;
        border: none;
        height : 32px;
        width : 100px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 9px;
        transition: opacity 0.15s;
    }

    .subscribe-button:hover{
        opacity : 0.70;
    }    

    .subscribe-button:active{
        opacity: 0.55;
    }

    .join-button
    {
        background-color: white;
        color: rgb(41, 118, 211);    
        width : 55px;
        height : 32px;
        border-width: 1px;
        border-style: solid; /*Because otherwise a part of the border is darker than the other */
        border-color: rgb(41, 118, 211);
        border-radius: 2px;
        cursor: pointer;
        margin-right: 9px;
        transition: background-color 0.15s,color 0.15s;
    }

    /*hover and active are pseudoclasses*/
    .join-button:hover{
        background-color: rgb(41, 118, 211);
        color:white;
    }

    .join-button:active{
        opacity: 0.70;
    }
    .tweet-button
    {
        background-color: rgb(4, 140, 255);
        color : white;
        width : 65px;
        height : 31px;
        border: none;
        border-radius: 15.5px;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        transition: box-shadow 0.15s;
    }

    .tweet-button:hover{
        box-shadow: 0px 5px 10px rgba(0,0,0,0.15);
    }

    .tweet-button:active{
        opacity: 0.8;
    }


</style>

<button class="subscribe-button">
    Subscribe
</button>

<button class="join-button">
    JOIN
</button>

<button class="tweet-button">
    Tweet
</button>

<br><br><br>
