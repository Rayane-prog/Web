<!DOCTYPE html>
<html>
    <head>
        <title>search bars</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                color : rgb(90,90,90);
                font-size: 11px;
            }
            .first
            {
                font-size : 16px;
                padding : 10px;
                border-style : solid;
                border-width : 1px;
                border-radius: 4px;
                margin-bottom: 30px;
            }

            .second
            {
                font-size:16px;
                width: 470px;
                border-radius: 30px;
                padding-right: 20px;
                padding-left: 20px;
                padding-top: 10px;
                padding-bottom: 10px;
                border: none;
                box-shadow: 0px 1px 5px rgba(0,0,0,0.25);
                margin-bottom: 30px;
            } 

            .linkedin-bar
            {
                width:265px;
                padding-top : 10px;
                padding-bottom: 10px;
                border-style: solid;
                margin-bottom: 10px;
            }

            .linkedin-button
            {
                background-color : rgb(10,102,194);
                color : white;
                border : none;
                width: 265px;
                padding-top:10px;
                padding-bottom: 10px;
                border-radius: 100px;
                cursor: pointer;
                margin-bottom : 30px;
            }

            .linkedin-button:hover
            {
                opacity: 0.9;
            }

            .cat-img
            {
                width : 30px;
                height : 30px;
                object-fit: cover;
                border-radius: 100px;
            }

            .cat-img
            {
                vertical-align:middle;
            }

            .tweet-text
            {
                width : 220px;
                border : none;
            }

            .tweet-button
            {
                background-color : rgb(29,161,242);
                color : white;
                border-radius: 30px;
                padding-top : 6px;
                padding-bottom : 6px;
                padding-right : 12px;
                padding-left : 12px;
                border : none;
            }
            
            

            
        </style>
    </head>
    <body>
        <input class="first" type="text" placeholder="Search">
        <br>
        <input class="second" type="text" placeholder="Search Google or type a URL">
        <br>

        <p>Email</p>
        <input class="linkedin-bar" type="text">
        <p>By clicking Agree & join, you agree to the Privacy Policy.</p>
        <button class="linkedin-button">
            Agree & Join
        </button>
        <br>

        <img src="/youtube/htmlImages/cat.jpg" class="cat-img">
        <input type="text" class="tweet-text" placeholder="What's happening">
        <button class="tweet-button">
            Tweet
        </button>

    </body>
</html>
