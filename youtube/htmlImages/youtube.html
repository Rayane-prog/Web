<!DOCTYPE html>
<html>
    <head>
        <title>Cat image</title>
        <style>

            .cat1
            {
                width:200px;
                border-radius: 10px;
                
            }
            .cat2
            {
                width:200px;
                height:200px;
                object-fit: cover;
                object-position: center;
            }
            
            .cat3
            {
                border-radius: 100px;
                width: 200px;
                height: 200px;
                object-fit: cover;
            }

            
        </style>
    </head>
    <body>
        <img  class="cat1" src="cat.jpg">
        <br>
        <img  class="cat2" src="cat.jpg">
        <br>
        <img  class="cat3" src="cat.jpg">

    </body>
</html>
